name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: PR gerado pelo Issue Form
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formatação
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Validar conteúdo
        run: pnpm validate

      - name: JSON Schema atualizado
        run: pnpm schema:check

      - name: Contraste AA dos tokens
        run: pnpm contrast:check

      - name: Chaves i18n
        run: pnpm check:i18n

      - name: Testes unitários
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Browsers do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Testes e2e e acessibilidade
        run: pnpm test:e2e
