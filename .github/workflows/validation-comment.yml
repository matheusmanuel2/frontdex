name: PR validation feedback

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report-validation-errors:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Baixar o log de validação
        uses: actions/download-artifact@v4
        with:
          name: validation-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: validation-artifact

      - name: Verificar se falhou a validação de conteúdo
        id: validation-errors
        run: |
          if [ -f validation-artifact/validate.log ] && grep -q '^✗ .* › ' validation-artifact/validate.log; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comentar e rotular o PR
        if: steps.validation-errors.outputs.found == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          VALIDATION_LOG: validation-artifact/validate.log
        run: pnpm exec tsx scripts/report-validation-errors.ts
